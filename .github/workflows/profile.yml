name: profile engine

# Правишь config/profile.toml или код движка → GitHub сам пересобирает SVG
# и коммитит их вместе с обновлённым README. Раз в день — то же самое ради живой
# статистики проектов (коммит будет, только если цифры правда поменялись).
on:
  push:
    branches: [main]
    paths: ["config/**", "engine/**"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-engine
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev      # Python из .python-version, зависимости из uv.lock
      - run: uv run --no-sync python -m engine build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # выше лимит GitHub API
      - name: Commit regenerated cards
        run: |
          git config user.name  "profile-engine"
          git config user.email "actions@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "🍱 chore: regenerate cards [skip ci]"
          git push
