[project]
name = "profile-engine"
version = "0.1.0"
description = "Animated SVG cards for the GitHub profile README"
requires-python = ">=3.11"
dependencies = [
    "fonttools>=4.50",
    "brotli>=1.1",
]

[dependency-groups]
# только для проверки кадров: uv run playwright install chromium
dev = ["playwright>=1.40"]

[tool.uv]
package = false   # не библиотека: запускается как python -m engine
