# ─────────────────────────────────────────────────────────────────────────────
# profile.toml — всё, что говорят карточки. Код движка трогать не нужно.
# Пересобрать:  uv run python -m engine build
# ─────────────────────────────────────────────────────────────────────────────

name       = "David Chapanyan"
grade      = "Senior"
role       = "Backend Engineer"
experience = "5+ years"
focus      = "payments, ledgers, event-driven"

# GitHub-логин: нужен, чтобы в README были абсолютные ссылки с ?v=хэш
# (так GitHub не показывает старую закэшированную картинку). Пусто = относительные пути.
github_user = ""

# Фразы, которые nvim по очереди вписывает в поле `now`.
# В редакторе влезает до 41 символа, в терминале длинные переносятся на 2 строки.
now = [
  "moving accruals from batch to Kafka",
  "idempotent ledgers in PostgreSQL",
  "reconciling payouts with providers",
  "p95 accrual lag: 50 min to 30 s",
]

# Группы стека: в коде идут одним кортежем, в neofetch-выводе — по строкам.
[[stack]]
label = "lang"
items = ["Python", "asyncio", "Pydantic"]

[[stack]]
label = "web"
items = ["FastAPI", "Django/DRF", "SQLAlchemy"]

[[stack]]
label = "data"
items = ["PostgreSQL", "Redis", "ClickHouse"]

[[stack]]
label = "queue"
items = ["Kafka", "RabbitMQ", "Celery"]

[[stack]]
label = "infra"
items = ["Docker", "k8s", "CI/CD"]

[[stack]]
label = "observe"
items = ["Grafana", "OpenTelemetry", "Sentry"]

# Клавиши над редактором. color: teal | blue | violet | orange | pink | yellow | green | dark
[[badges]]
label = "lang"
value = "Python first"
color = "teal"

[[badges]]
label = "grade"
value = "Senior"
color = "violet"

[[badges]]
label = "experience"
value = "5+ years"
color = "blue"

[[badges]]
label = "domain"
value = "payments · fintech"
color = "yellow"

[[badges]]
label = "daily driver"
value = "Kafka · PostgreSQL"
color = "orange"

[[badges]]
label = "security"
value = "first"
color = "dark"

[[badges]]
label = "mindset"
value = "idempotent by design"
color = "pink"

# ── проекты ──────────────────────────────────────────────────────────────────
# Цифры (решённые задачи, звёзды) и код решений движок берёт из GitHub API при сборке;
# Action пересобирает раз в день. Последний снимок — assets/stats.json.

[algorithms]
repo = "tsfEmpaty/Algorithms"
tagline = "Classic patterns, not memorized answers"
# папка-источник в репо → подпись на карточке (порядок = порядок чипов)
sources = { algoexpert = "AlgoExpert", grokking_algorithms = "Grokking", leetcode = "LeetCode", neetcode = "NeetCode", codewars = "Codewars" }
# задачи, которые карточка по очереди «сабмитит» (папка с solution*.py)
showcase = [
  "algoexpert/easy/NthFibonacci",
  "algoexpert/medium/LongestPeak",
  "algoexpert/hard/ShiftLinkedList",
]

[aura]
repo = "tsfEmpaty/logseq-aura-dark-theme"
kicker = "Logseq theme"
title = "Aura Dark"
subtitle = "for Logseq"
# описание слева, по строке (до 40 символов)
about = [
  "Deep purple dark theme for Logseq,",
  "ported from the Aura Dark VS Code theme.",
  "Whole UI, code blocks, bundled Nerd Font.",
]
# блок в превью, который печатается и стирается по кругу (до 40 символов);
# {stars} подставляется из API
typing = [
  "Install: [[Marketplace]] > Themes",
  "Switch theme with `t i` #shortcut",
  "{stars} stars on #github so far",
]
